<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Heelee ASCII</title>
<style>
  @font-face {
    font-family: "Heelee ASCII";
    src: url("heelee-ascii.woff") format("woff");
  }
  body {
    margin: 0;
    background: #1b1b1a;
    color: #ecebe6;
    font-family: system-ui, sans-serif;
  }
  main {
    max-width: 48rem;
    margin: 0 auto;
    padding: 2rem 1rem;
  }
  p {
    margin: 0 0 0.75rem;
  }
  textarea {
    box-sizing: border-box;
    width: 100%;
    height: 50vh;
    padding: 0.75rem;
    border: 1px solid #3a3936;
    border-radius: 6px;
    background: #232322;
    color: #ecebe6;
    font-family: "Heelee ASCII", sans-serif;
    font-size: 1.5rem;
    line-height: 1.4;
    resize: vertical;
  }
  textarea:focus {
    outline: none;
    border-color: #6b6a65;
  }
  @media (max-width: 40rem) {
    main {
      padding: 1rem 0;
    }
    p {
      padding: 0 1rem;
    }
    textarea {
      border-radius: 0;
      border-left: none;
      border-right: none;
    }
  }
</style>
</head>
<body>
<main>
  <p>Type something...</p>
  <textarea spellcheck="false" autofocus></textarea>
</main>
</body>
</html>
